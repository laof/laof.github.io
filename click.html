<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    
</head>
<body>
    
    <h1>回调 打开新页签window.open， 正对safari 的测试 </h1>
   <button onclick="openwin()">click</button>

    <script>

        function openwin (){
            fetch("https://laof.github.io/page.json").then(response => response.json())
            .then(data => {
                console.log(data);
                window.open('https://www.baidu.com', '_blank');
            });
        }

    </script>
</body>
</html>
